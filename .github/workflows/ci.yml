name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: council-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/gitleaks-bin" gitleaks
          touch "$RUNNER_TEMP/no-gitleaks-ignores"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignores"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COUNCIL_SOFTWARE_TEST_DSN: ""
      COUNCIL_SOFTWARE_TEST_USER: ""
      COUNCIL_SOFTWARE_TEST_PASSWORD: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: curl, pdo_sqlite, zip
          coverage: none
      - name: PHP syntax and regression tests
        run: php tests/check.php
      - name: Release packaging and readiness tests
        run: python -m unittest discover -s tests -p test_release.py
      - name: Validate the main-bound installable package before merge
        if: github.event_name == 'push' || github.base_ref == 'main' || github.event_name == 'merge_group'
        run: python .github/scripts/release.py package --output-dir "$RUNNER_TEMP/package-check"

  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version before merge or publication
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
        run: python .github/scripts/release.py check

  release:
    name: Publish release
    needs: [secrets, tests, readiness]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'trooptrailer/council-sync-blesta-plugin' &&
      needs.readiness.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: council-sync-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build installable ZIP
        run: python .github/scripts/release.py package --output-dir "$RUNNER_TEMP"
      - name: Publish only after the complete ZIP is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py publish --output-dir "$RUNNER_TEMP"
